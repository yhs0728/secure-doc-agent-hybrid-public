name: secure-doc-agent-hybrid
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secure_doc_agent}
      POSTGRES_USER: ${POSTGRES_USER:-secure_doc_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
    - 127.0.0.1:55442:5432
    volumes:
    - micro_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  bootstrap-db:
    build: ./infra/database
    restart: 'no'
    environment:
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-secure_doc_agent}
      POSTGRES_USER: ${POSTGRES_USER:-secure_doc_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD}
      KNOWLEDGE_DB_PASSWORD: ${KNOWLEDGE_DB_PASSWORD:?Set KNOWLEDGE_DB_PASSWORD}
      CONVERSATION_DB_PASSWORD: ${CONVERSATION_DB_PASSWORD:?Set CONVERSATION_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
  identity:
    image: secure-doc-agent-hybrid/identity:${IDENTITY_IMAGE_TAG:-1.0.0}
    build: ./microservices/identity
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-secure_doc_agent}
      DB_USER: svc_identity
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET}
      AUTH_ACCESS_TOKEN_MINUTES: ${AUTH_ACCESS_TOKEN_MINUTES:-30}
      DEFAULT_WORKSPACE_ID: ${DEFAULT_WORKSPACE_ID:-00000000-0000-7000-8000-000000000003}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@secure-doc.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD}
    depends_on:
      bootstrap-db:
        condition: service_completed_successfully
    healthcheck:
      test: &id001
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/ready',
        timeout=5)
      interval: 15s
      timeout: 7s
      retries: 10
      start_period: 30s
  knowledge:
    image: secure-doc-agent-hybrid/knowledge:${KNOWLEDGE_IMAGE_TAG:-1.0.0}
    build: ./microservices/knowledge
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-secure_doc_agent}
      DB_USER: svc_knowledge
      DB_PASSWORD: ${KNOWLEDGE_DB_PASSWORD:?Set KNOWLEDGE_DB_PASSWORD}
      IDENTITY_URL: http://identity:8000
      KNOWLEDGE_SERVICE_TOKEN: ${KNOWLEDGE_SERVICE_TOKEN:?Set KNOWLEDGE_SERVICE_TOKEN}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      OBJECT_STORAGE_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT_URL:-http://minio:8333}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-secure-documents}
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-secure-doc-storage}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-}
      OPENSEARCH_VERIFY_CERTS: ${OPENSEARCH_VERIFY_CERTS:-true}
      OPENSEARCH_CA_CERTS: ${OPENSEARCH_CA_CERTS:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      CHUNK_SIZE: ${CHUNK_SIZE:-500}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-50}
      MAX_UPLOAD_BYTES: '26214400'
      MAX_EXTRACTED_CHARACTERS: ${MAX_EXTRACTED_CHARACTERS:-8000000}
      MAX_DOCUMENT_CHUNKS: ${MAX_DOCUMENT_CHUNKS:-10000}
      HF_HOME: /home/service/.cache/huggingface
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    depends_on:
      bootstrap-db:
        condition: service_completed_successfully
    healthcheck:
      test: *id001
      interval: 15s
      timeout: 7s
      retries: 10
      start_period: 10m
    volumes:
    - micro_model_cache:/home/service/.cache/huggingface
    deploy:
      replicas: ${KNOWLEDGE_REPLICAS:-1}
      resources:
        limits:
          cpus: '2'
          memory: 2G
  conversation:
    image: secure-doc-agent-hybrid/conversation:${CONVERSATION_IMAGE_TAG:-1.0.0}
    build: ./microservices/conversation
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-secure_doc_agent}
      DB_USER: svc_conversation
      DB_PASSWORD: ${CONVERSATION_DB_PASSWORD:?Set CONVERSATION_DB_PASSWORD}
      IDENTITY_URL: http://identity:8000
      KNOWLEDGE_URL: http://knowledge:8000
      KNOWLEDGE_SERVICE_TOKEN: ${KNOWLEDGE_SERVICE_TOKEN:?Set KNOWLEDGE_SERVICE_TOKEN}
      LLM_MODEL: ${LLM_MODEL:-qwen3:4b-instruct}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-300}
      LLM_THINKING: ${LLM_THINKING:-false}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-1}
      LLM_QUEUE_TIMEOUT_SECONDS: ${LLM_QUEUE_TIMEOUT_SECONDS:-5}
      LLM_HISTORY_MAX_CHARACTERS: ${LLM_HISTORY_MAX_CHARACTERS:-2000}
      RETRIEVAL_K: ${RETRIEVAL_K:-3}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      CAPACITY_BACKEND: ${CAPACITY_BACKEND:-redis}
      REDIS_HOST: redis
      REDIS_NAMESPACE: ${REDIS_NAMESPACE:-secure-doc}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      LLM_CAPACITY_POOL: ${LLM_CAPACITY_POOL:-default}
      LLM_SLOT_TTL_SECONDS: ${LLM_SLOT_TTL_SECONDS:-900}
      RAG_RATE_LIMIT_REQUESTS: ${RAG_RATE_LIMIT_REQUESTS:-30}
      RAG_RATE_LIMIT_WINDOW_SECONDS: ${RAG_RATE_LIMIT_WINDOW_SECONDS:-60}
    depends_on:
      bootstrap-db:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: *id001
      interval: 15s
      timeout: 7s
      retries: 10
      start_period: 30s
    extra_hosts:
    - host.docker.internal:host-gateway
    deploy:
      replicas: ${CONVERSATION_REPLICAS:-1}
  knowledge-worker:
    image: secure-doc-agent-hybrid/knowledge:${KNOWLEDGE_IMAGE_TAG:-1.0.0}
    build: ./microservices/knowledge
    command:
    - python
    - -m
    - knowledge_service.worker
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-secure_doc_agent}
      DB_USER: svc_knowledge
      DB_PASSWORD: ${KNOWLEDGE_DB_PASSWORD:?Set KNOWLEDGE_DB_PASSWORD}
      IDENTITY_URL: http://identity:8000
      KNOWLEDGE_SERVICE_TOKEN: ${KNOWLEDGE_SERVICE_TOKEN:?Set KNOWLEDGE_SERVICE_TOKEN}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      OBJECT_STORAGE_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT_URL:-http://minio:8333}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-secure-documents}
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-secure-doc-storage}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-}
      OPENSEARCH_VERIFY_CERTS: ${OPENSEARCH_VERIFY_CERTS:-true}
      OPENSEARCH_CA_CERTS: ${OPENSEARCH_CA_CERTS:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      CHUNK_SIZE: ${CHUNK_SIZE:-500}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-50}
      MAX_UPLOAD_BYTES: '26214400'
      MAX_EXTRACTED_CHARACTERS: ${MAX_EXTRACTED_CHARACTERS:-8000000}
      MAX_DOCUMENT_CHUNKS: ${MAX_DOCUMENT_CHUNKS:-10000}
      HF_HOME: /home/service/.cache/huggingface
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    volumes:
    - micro_model_cache:/home/service/.cache/huggingface
    depends_on:
      bootstrap-db:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
      resources:
        limits:
          cpus: '2'
          memory: 2G
  gateway:
    image: secure-doc-agent-hybrid/web:${WEB_IMAGE_TAG:-1.0.0}
    build: ./frontend
    restart: unless-stopped
    ports:
    - 127.0.0.1:18082:8000
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --spider
      - http://127.0.0.1:8000/
      interval: 15s
      timeout: 5s
      retries: 5
  minio:
    image: chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      S3_BUCKET: ${OBJECT_STORAGE_BUCKET:-secure-documents}
    ports:
    - 127.0.0.1:19012:8333
    volumes:
    - micro_objects:/data
    healthcheck:
      test:
      - CMD
      - curl
      - --silent
      - --output
      - /dev/null
      - http://localhost:8333
      interval: 5s
      timeout: 5s
      retries: 20
  opensearch:
    image: opensearchproject/opensearch:3.3.2
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: 'true'
      bootstrap.memory_lock: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
    - 127.0.0.1:19212:9200
    volumes:
    - micro_search:/usr/share/opensearch/data
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:9200/_cluster/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles:
    - monitoring
    restart: unless-stopped
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --web.enable-lifecycle
    ports:
    - 127.0.0.1:29092:9090
    volumes:
    - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./infra/prometheus-microservices-alerts.yml:/etc/prometheus/rules/secure-doc.yml:ro
    - micro_prometheus:/prometheus
    depends_on:
    - alertmanager
  grafana:
    image: grafana/grafana:12.1.0
    profiles:
    - monitoring
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-before-monitoring}
    ports:
    - 127.0.0.1:13002:3000
    volumes:
    - micro_grafana:/var/lib/grafana
    - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
    - prometheus
  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles:
    - monitoring
    restart: unless-stopped
    command:
    - --config.file=/etc/alertmanager/alertmanager.yml
    - --storage.path=/alertmanager
    ports:
    - 127.0.0.1:29102:9093
    volumes:
    - ./infra/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    - micro_alertmanager:/alertmanager
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command:
    - sh
    - /etc/secure-doc-redis/start.sh
    volumes:
    - ./infra/redis:/etc/secure-doc-redis:ro
    - micro_redis:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 15
    user: redis
volumes:
  micro_postgres_data: null
  micro_objects: null
  micro_search: null
  micro_model_cache: null
  micro_prometheus: null
  micro_grafana: null
  micro_alertmanager: null
  micro_redis: null
