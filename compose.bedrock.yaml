# Use with compose.yaml; no paid resources are created by this file.
services:
  conversation:
    environment:
      LLM_PROVIDER: bedrock
      LLM_BASE_URL: https://bedrock-mantle.${AWS_REGION:-ap-northeast-1}.api.aws/v1
      LLM_MODEL: ${BEDROCK_MODEL_ID:-qwen.qwen3-32b}
      LLM_API_KEY: ${BEDROCK_API_KEY:-}
      LLM_ANSWER_MAX_TOKENS: ${LLM_ANSWER_MAX_TOKENS:-1024}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-1}
      CAPACITY_BACKEND: redis
      HYBRID_EXTERNAL_WORKSPACES: ${HYBRID_EXTERNAL_WORKSPACES:-}
      HYBRID_CIRCUIT_FAILURES: ${HYBRID_CIRCUIT_FAILURES:-3}
      HYBRID_CIRCUIT_COOLDOWN_SECONDS: ${HYBRID_CIRCUIT_COOLDOWN_SECONDS:-30}
      HYBRID_INFERENCE_BUDGET_SECONDS: ${HYBRID_INFERENCE_BUDGET_SECONDS:-90}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      FINOPS_ENABLED: "true"
      FINOPS_DAILY_CALL_LIMIT: ${FINOPS_DAILY_CALL_LIMIT:-60}
      FINOPS_MONTHLY_CALL_LIMIT: ${FINOPS_MONTHLY_CALL_LIMIT:-600}
      FINOPS_DAILY_CONTROL_USD: ${FINOPS_DAILY_CONTROL_USD:-1}
      FINOPS_MONTHLY_CONTROL_USD: ${FINOPS_MONTHLY_CONTROL_USD:-20}
      FINOPS_CONTROL_INPUT_USD_PER_M: ${FINOPS_CONTROL_INPUT_USD_PER_M:-1}
      FINOPS_CONTROL_OUTPUT_USD_PER_M: ${FINOPS_CONTROL_OUTPUT_USD_PER_M:-5}
      FINOPS_MAX_INPUT_BYTES: ${FINOPS_MAX_INPUT_BYTES:-32000}
      FINOPS_MAX_OUTPUT_TOKENS: ${FINOPS_MAX_OUTPUT_TOKENS:-1024}
