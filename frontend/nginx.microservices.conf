events { worker_connections 2048; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    resolver ${NGINX_DNS} valid=5s ipv6=off;
    sendfile on;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    server {
        listen 8000;
        client_max_body_size 26m;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1800s;
        # Per-request DNS avoids coupling web deployment to backend restarts.
        location ^~ /api/v1/auth/ {
            set $identity http://identity:8000;
            proxy_pass $identity;
        }
        location ~ ^/api/v1/(documents|index)(/|$) {
            set $knowledge http://knowledge:8000;
            proxy_pass $knowledge;
        }
        location ~ ^/api/v1/(questions|conversations)(/|$) {
            set $conversation http://conversation:8000;
            proxy_pass $conversation;
        }
        location = /api/v1/health {
            default_type application/json;
            return 200 '{"status":"healthy","service":"gateway"}';
        }
        location = /api/v1/ready {
            set $knowledge http://knowledge:8000;
            proxy_pass $knowledge/ready;
        }
        location /internal/ { return 404; }
        location /api/ { return 404; }
        location = /metrics { return 404; }
        location /assets/ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
