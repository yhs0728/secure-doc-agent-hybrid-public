route:
  receiver: local-alerts
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

# Local default: alerts remain visible in Alertmanager without leaving the host.
# Add a real receiver in an environment-specific deployment configuration.
receivers:
  - name: local-alerts

inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [alertname]
