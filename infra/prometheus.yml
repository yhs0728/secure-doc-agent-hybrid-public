global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
- /etc/prometheus/rules/*.yml
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - alertmanager:9093
scrape_configs:
- job_name: identity
  dns_sd_configs:
  - names:
    - identity
    type: A
    port: 8000
    refresh_interval: 10s
  metrics_path: /metrics
- job_name: knowledge
  dns_sd_configs:
  - names:
    - knowledge
    type: A
    port: 8000
    refresh_interval: 10s
  metrics_path: /metrics
- job_name: conversation
  dns_sd_configs:
  - names:
    - conversation
    type: A
    port: 8000
    refresh_interval: 10s
  metrics_path: /metrics
